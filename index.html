<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>החידון של סטיץ'!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #005c8a, #0099ff, #ff69b4);
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
        }

        /* כותרת וסטטיסטיקות */
        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e6f2ff;
            padding: 12px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #005c8a;
        }

        .stat-box {
            display: flex;
            gap: 10px;
        }

        .correct-count { color: #2e7d32; }
        .wrong-count { color: #c62828; }

        /* סרגל התקדמות */
        .progress-bar-container {
            width: 100%;
            background: #ddd;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #0099ff);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* אזור סטיץ' הדמות */
        .stitch-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stitch-avatar {
            width: 80px;
            height: 80px;
            background: #1e88e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(30, 136, 229, 0.4);
            border: 3px solid #fff;
            position: relative;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* אוזניים של סטיץ' */
        .stitch-avatar::before, .stitch-avatar::after {
            content: '';
            position: absolute;
            top: -15px;
            width: 30px;
            height: 45px;
            background: #1e88e5;
            border-radius: 50% 50% 0 0;
            z-index: -1;
            border: 2px solid #fff;
        }
        .stitch-avatar::before { left: -10px; transform: rotate(-25deg); }
        .stitch-avatar::after { right: -10px; transform: rotate(25deg); }

        .stitch-face {
            font-size: 2.2rem;
        }

        .speech-bubble {
            background: #fff3e0;
            border: 2px solid #ffe0b2;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 1.1rem;
            color: #e65100;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            max-width: 70%;
            text-align: right;
        }

        /* שאלות ותשובות */
        .question-title {
            font-size: 1.4rem;
            color: #1a237e;
            margin-bottom: 20px;
            line-height: 1.4;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            font-weight: 600;
            color: #333;
        }

        .option-btn:hover:not(:disabled) {
            background: #e3f2fd;
            border-color: #90caf9;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .option-btn.correct {
            background: #c8e6c9 !important;
            border-color: #4caf50 !important;
            color: #1b5e20 !important;
        }

        .option-btn.wrong {
            background: #ffcdd2 !important;
            border-color: #f44336 !important;
            color: #b71c1c !important;
        }

        /* הודעת משוב */
        .feedback-box {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 35px;
        }

        /* כפתור הבא */
        .next-btn {
            background: linear-gradient(135deg, #ff4081, #f50057);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(245, 0, 87, 0.4);
            transition: transform 0.2s;
            margin-top: 15px;
            display: none;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        /* מסך סיום */
        .end-screen {
            display: none;
            text-align: center;
        }

        .end-screen h2 {
            font-size: 2.2rem;
            color: #1a237e;
            margin-bottom: 15px;
        }

        .restart-btn {
            background: linear-gradient(135deg, #00c853, #64dd17);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.4);
        }

        .sound-toggle {
            position: absolute;
            top: 20
