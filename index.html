<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הרפתקת העברית של סטיץ' 🌺</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --stitch-blue: #1e60b6;
      --stitch-light: #4fa3f7;
      --stitch-dark: #103778;
      --ear-pink: #ff85a1;
      --tropical-teal: #00b4d8;
      --hibiscus: #ff477e;
      --sun-yellow: #ffd166;
      --leaf-green: #06d6a0;
      --bg-gradient: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #90e0ef 100%);
    }

    * {
      box-sizing: border-box;
      font-family: 'Rubik', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
      color: #1d3557;
    }

    /* אלמנטים טרופיים ברקע */
    .bg-decor {
      position: fixed;
      font-size: 3rem;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(8deg); }
    }

    .game-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.96);
      width: 100%;
      max-width: 720px;
      border-radius: 28px;
      padding: 24px 28px;
      box-shadow: 0 20px 50px rgba(16, 55, 120, 0.35);
      border: 4px solid #ffffff;
    }

    /* סרגל עליון - ניקוד וספירה */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #f0f8ff;
      padding: 12px 18px;
      border-radius: 20px;
      border: 2px solid #caf0f8;
      margin-bottom: 16px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 1rem;
      padding: 6px 14px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    }

    .stat-question { color: var(--stitch-dark); border: 2px solid var(--stitch-light); }
    .stat-correct { color: #048a68; border: 2px solid var(--leaf-green); }
    .stat-wrong { color: #d90429; border: 2px solid var(--hibiscus); }

    .sound-btn {
      background: var(--sun-yellow);
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #e0a800;
      transition: transform 0.15s;
    }
